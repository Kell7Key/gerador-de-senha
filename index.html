<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GERADOR DE SENHAS</title>
</head>
<body>
   <section class="conteudo">
      <div class="conteudo-titulo">
      <img src="" alt="imagem de um cadeado">
      <h2 class="titulo-principal"> GERADOR DE SENHAS</h2>
      <h3 class="titulo-secundario">Gere senhas aleatorias e seguras</h3>

      </div>
      <div class="conteudo-senha">
        <label for="Senha">Senha</label>
        <input name="Senha"type="text" id="campo-senha">
      </div>
      <div class="parametro">
        <h3 class="parametro-titulo">Personalize sua senha</h3>
        <div class="parametro-coluna__senha">
            <div class="parametro-senha">
                <h4 class="parametro-senha__titulo">Numero de Caracteres
                    <div class="parametro-senha-botoes">
                        <button class="parametro-senha__botao">-</button>
                        <p class="parametro-senha__texto">12</p>
                        <button class="parametro-senha__botao">+</button>
                     </div>
                </h4>
            </div>
            <div class="parametro-senha">
                <h4 class="parametro-senha__titulo">Caracteristicas da Senha</h4>
                <div class="parametro-senha-checkbox">
                    <input name="maiusculo" type="checkbox" class="checkbox">
                    <label for="maiusculo">Letras maiusculas</label>
                </div>
                <div class="parametro-senha-checkbox">
                    <imput name= "numero" type="checkbox" class="checkbox">
                    <label for="numero">numeros</label>
                </div>
                <div class="parametro-senha-checkbox">
                    <input name="simbolo" type="checkbox" class="checkbox">
                    <label for="simbolo">simbolo</label>
                </div>
            </div>
            <div class="parametro-senha">
                <h4 class="parametro-senha__titulo">Forca da senha</h4>
                <div class="barra"></div>
                <div class="fraca fraca"></div>
                <div class="parametro-senha-textos">
                    <p>fraca</p>
                    <p>media<p>
                    <p>forte</p>
                </div>
                <p class="entropia"></p>
            </div>
        </div>
      </div>
    </section>
    <script src="main.js"></script>
</body>
</html>
